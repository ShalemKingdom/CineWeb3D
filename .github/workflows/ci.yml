name: Build and quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install FFmpeg for required media tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Local checks (no npm dependencies)
        run: npm run validate:local
      - name: Require reviewed lockfiles
        run: npm run release:check
      - run: npm run security:check
      - run: npm audit --package-lock-only --audit-level=low
      - run: npm --prefix templates/coffee-astro audit --package-lock-only --audit-level=low
      - run: npm --prefix tools/assets audit --package-lock-only --audit-level=low
      - run: npm ci --no-audit
      - run: npm --prefix templates/coffee-astro ci --no-audit
      - run: npm --prefix tools/assets ci --no-audit
      - run: npm run build
      - run: npm run diagnostics:assets -- dist --strict
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse (local reports)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run quality
      - name: Astro template
        run: npm run build:astro
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/
            test-results/
