name: Commercial Showcase
on:
  push:
    branches: [sandbox]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm run security:stable
      - run: npm audit --package-lock-only --audit-level=low
      - run: npm ci --no-audit
      - run: npm run build
      - run: npm run diagnostics:assets -- dist --strict
      - run: npx playwright install --with-deps chromium
      - name: Showcase browser checks and screenshots
        run: npm run test:e2e -- --grep Grounds
      - name: Showcase mobile Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run quality -- --config=lighthouserc.showcase.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grounds-showcase-evidence
          path: |
            test-results/
            reports/lighthouse-showcase/
          retention-days: 14
