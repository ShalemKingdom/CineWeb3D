name: Security and License Shield
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shield:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run security:check
      - name: Audit exact locks before installation
        run: |
          mkdir -p reports/security-shield
          status=0
          for project in . templates/coffee-astro tools/assets; do
            name=$(echo "$project" | tr '/.' '_')
            npm --prefix "$project" audit --package-lock-only --audit-level=low --json > "reports/security-shield/audit-$name.json" || status=1
            npm --prefix "$project" sbom --package-lock-only --sbom-format cyclonedx > "reports/security-shield/sbom-$name.json" || status=1
          done
          exit "$status"
      - name: Install only for inspecting actual license files (no lifecycle scripts)
        run: |
          npm ci --ignore-scripts --no-audit
          npm --prefix templates/coffee-astro ci --ignore-scripts --no-audit
          npm --prefix tools/assets ci --ignore-scripts --no-audit
      - run: npm run security:check -- --installed
      - name: Regression tests
        run: node --test tests/security-shield.test.js
      - name: Record stable readiness separately
        run: |
          mkdir -p reports/security-shield
          cp reports/security-shield/inventory.json reports/security-shield/sandbox-inventory.json
          if npm run security:stable -- --installed > reports/security-shield/stable-check.txt 2>&1; then
            echo "License policy passed; manual distribution review still required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stable release BLOCKED by license policy; see artifact." >> "$GITHUB_STEP_SUMMARY"
            if [ "$GITHUB_REF_TYPE" = tag ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-license-evidence
          path: reports/security-shield/
          retention-days: 14
