name: Smart Video Engine smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real video tests
        run: python3 -m unittest discover -s tests -p test_smart_video.py -v
      - name: Multimedia orchestration tests
        run: python3 -m unittest discover -s tests -p test_ai_multimedia.py -v
