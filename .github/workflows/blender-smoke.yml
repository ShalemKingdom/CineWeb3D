name: Blender Bridge smoke
on:
  workflow_dispatch:
  push:
    branches: [sandbox]
    paths:
      - '.github/workflows/blender-smoke.yml'
      - 'integrations/blender/**'
      - 'scripts/blender_bridge.py'
      - 'scripts/smart-assets.mjs'
      - 'tools/assets/package*.json'
      - 'package*.json' 
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download official Blender 4.5 LTS and verify upstream checksum
        shell: bash
        run: |
          set -euo pipefail
          version=4.5.17
          archive="blender-$version-linux-x64.tar.xz"
          base=https://download.blender.org/release/Blender4.5
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/blender-$version.sha256" -o checksums.txt
          awk -v name="$archive" '$2 == name || $2 == "*" name { print $1 "  " name }' checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-$version-linux-x64" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve lock candidates for sandbox if missing
        if: github.ref == 'refs/heads/sandbox'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm --prefix templates/coffee-astro install --package-lock-only --ignore-scripts --no-audit
          npm --prefix tools/assets install --package-lock-only --ignore-scripts --no-audit
      - run: npm run release:check
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm --prefix tools/assets audit --package-lock-only --audit-level=moderate
      - run: npm --prefix tools/assets ci --no-audit
      - name: Test real scene export
        run: |
          blender --version
          python3 scripts/blender_bridge.py --output generated/blender/smoke
          npm run assets:optimize -- generated/blender/smoke/scene.glb generated/blender/smoke/web.glb
          npm run blender:publish -- generated/blender/smoke/web.glb
      - name: Build and check imported model in Chromium
        env:
          CINEWEB3D_ASSET_SMOKE: "1"
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "optimized Blender model"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-smoke
          path: generated/blender/smoke/
