<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Optional smart video example</title><style>body{margin:0;background:#1b1512;color:#fff;font:1rem system-ui}main{max-width:60rem;margin:auto;padding:1rem}button{padding:.8rem;margin:.4rem}button:focus-visible{outline:3px solid #ffd186}#story{min-height:250vh}.sticky{position:sticky;top:1rem}video,img{display:block;width:100%;max-height:65vh;object-fit:contain}video[hidden],img[hidden]{display:none}@media(prefers-reduced-motion:reduce){#story{min-height:auto}.sticky{position:static}}</style></head><body><main><h1>Optional cinematic video</h1><p>Scroll to explore a silent decorative clip, or use manual playback. The static coffee illustration remains available without video.</p><section id="story"><div class="sticky"><button id="scroll">Load scroll video</button><button id="manual">Load manual video</button><button id="stop">Unload video</button><p id="status" role="status">No video loaded.</p><img id="fallback" src="/coffee-poster.svg" width="800" height="640" alt="Illustrated coffee cup"><video id="clip" hidden muted playsinline controls preload="none" aria-label="Decorative cinematic video"></video></div></section><p>End of example.</p><details><summary>Developer diagnostics (local only)</summary><button type="button" id="diagnostic-toggle" aria-pressed="false">Start local diagnostics</button><button type="button" id="diagnostic-refresh">Refresh report</button><pre id="diagnostic-output" hidden style="white-space:pre-wrap;overflow-wrap:anywhere" aria-label="Local diagnostic report"></pre></details></main><script type="module">
import {diagnosticSession} from '../../src/modules/diagnostics.js';
import {mountDiagnosticPanel} from '../../src/modules/diagnostic-panel.js';
mountDiagnosticPanel({button:document.querySelector('#diagnostic-toggle'),output:document.querySelector('#diagnostic-output')});
import {mountSmartVideo,prefetchVideoManifest} from '../../src/smart-video.js';
const video=document.querySelector('#clip'),fallback=document.querySelector('#fallback'),status=document.querySelector('#status'),buttons=[...document.querySelectorAll('#story button')];let cleanup;const manifestUrl=`${import.meta.env.BASE_URL}media/coffee/manifest.json`;let intent;
function warm(){if(intent)return;const controller=new AbortController();intent=controller;prefetchVideoManifest(manifestUrl,{signal:controller.signal}).catch(()=>{}).finally(()=>{if(intent===controller)intent=null;});}
function cancelWarm(){intent?.abort();intent=null;}
for(const button of buttons.slice(0,2)){button.addEventListener('pointerenter',warm);button.addEventListener('focus',warm);button.addEventListener('pointerleave',cancelWarm);button.addEventListener('blur',cancelWarm);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelWarm();});
function reset(){cleanup?.();cleanup=null;video.hidden=true;fallback.hidden=false;}
async function load(scroll){buttons.forEach(b=>b.disabled=true);reset();status.textContent='Loading selected video…';try{cleanup=await mountSmartVideo(video,document.querySelector('#story'),manifestUrl,{scroll});video.hidden=false;fallback.hidden=true;status.textContent=scroll&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'Scroll to scrub, or choose manual video.':'Use the native video controls.';}catch(e){diagnosticSession()?.issue('video');reset();status.textContent='Video unavailable. Prepare and review the local media files first.';console.warn(e);}finally{buttons.forEach(b=>b.disabled=false);}}
video.addEventListener('error',()=>{diagnosticSession()?.issue('video');reset();status.textContent='Video unavailable; static illustration shown.';});
document.querySelector('#scroll').onclick=()=>load(true);document.querySelector('#manual').onclick=()=>load(false);document.querySelector('#stop').onclick=()=>{reset();status.textContent='No video loaded.';};
</script></body></html>
